name: Línea de iOS

# iOS va después (founder, 3-nov-2026): cada PR a develop dice qué pasa con iOS, para que nada se quede sin anotar.
# Regla: AGENTS.md del workspace, «Producto entre repos». Recetario: docs/proyectos/ios-por-hacer.md del workspace.
# Se borra el día que le toque su turno a iOS.

on:
  pull_request:
    branches: [develop]
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  linea-ios:
    name: El PR dice qué pasa con iOS
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Buscar la línea de iOS en la descripción
        env:
          CUERPO: ${{ github.event.pull_request.body }}
        run: |
          LINEA=$(printf '%s\n' "$CUERPO" | tr -d '\r' | sed -nE 's/^[[:space:]*_-]*iOS[*_]*:[*_]*[[:space:]]*//p' | sed -E 's/[[:space:]]+$//' | grep -m1 . || true)
          BIEN=1
          case "$LINEA" in
            ''|'<'*|*'título de la ficha'*|*'titulo de la ficha'*|*'(razón)'*|*'(razon)'*) BIEN=0 ;;
          esac
          printf '%s' "$LINEA" | grep -q '[[:alnum:]]' || BIEN=0
          if printf '%s' "$LINEA" | grep -Eixq 'pendiente|por hacer|todo|tbd|n/?a|no|si|sí'; then BIEN=0; fi
          if printf '%s' "$LINEA" | grep -Eiq '^no aplica' && ! printf '%s' "$LINEA" | grep -Eiq '^no aplica[^[:alnum:]]+[[:alnum:]]'; then BIEN=0; fi
          if [ "$BIEN" = 1 ]; then
            echo "✅ El PR dice qué pasa con iOS: $LINEA"
          else
            echo "::error::Falta la línea de iOS en la descripción del PR, o sigue de relleno. Agrega el título real de la ficha («iOS: Tarjetas de regalo») o «iOS: no aplica» con su razón («iOS: no aplica (sólo WINDOWS)»). Cómo se anota: docs/proyectos/ios-por-hacer.md del workspace."
            exit 1
          fi
