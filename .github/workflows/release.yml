name: Release

# Publica en Google Play. DOS carriles:
#
#   1. push a main (tocando código de la app) → CANAL INTERNO, automático.
#      Tus clientes lo reciben en MINUTOS por su Play Store normal, sin revisión
#      de Google. Es el carril de hotfix. Decisión del founder (2026-09-03): TODOS
#      los clientes van en él.
#   2. botón "Run workflow" → el canal que elijas. Producción SIEMPRE en borrador:
#      queda esperando tu clic en Play Console. Ésa es la única puerta humana, y
#      es suficiente porque nadie recibe nada hasta que la abras.
#
# No hay carril de ETIQUETA a propósito: en un mismo `on: push` el filtro de rutas
# se aplicaría también a los tags, y un tag podría no publicar en silencio. Con el
# carril 1 automático, la etiqueta ya no aporta nada.
#
# ⚠️ Límite declarado: el botón a producción RECOMPILA en vez de promover el mismo
# artefacto que ya probaron tus clientes en interno. Publicar exactamente el binario
# probado (promoción por versionCode, sin rebuild) queda pendiente.
#
# 🔴 Lo que este workflow NO hace, y no puede hacer: actualizar la app por fuera
# de Play. La política de Device and Network Abuse lo prohíbe para apps publicadas
# en la tienda, y la sanción es que la bajen. El AppUpdate propio del repo del
# server es SÓLO para la PAX, que no está en Play.

on:
  push:
    branches: [main]
    paths:                      # un cambio de docs no le manda una versión a nadie
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      track:
        description: 'Canal de Play'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      notas:
        description: 'Notas de la versión (es-419)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Un push encima de otro cancela el anterior: no vale gastar 40 minutos de runner
  # publicando un commit que ya quedó atrás.
  cancel-in-progress: true

jobs:
  publicar:
    name: Firmar y publicar
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TRACK: ${{ github.event.inputs.track || 'internal' }}

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # El runner tiene 7 GB y el repo pide 6 sólo para Gradle; el daemon de Kotlin
      # arranca aparte con otros 2. Es la combinación que mató un build de 32 min
      # en la Mac. Se acota desde GRADLE_USER_HOME, que gana sobre el del proyecto.
      - name: Acotar memoria al tamaño del runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx2g
          org.gradle.workers.max=2
          org.gradle.daemon=false
          org.gradle.parallel=false
          EOF

      - name: SDK de Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Dependencias de los scripts de Play
        run: pip install --quiet PyJWT cryptography

      # ── La versión ────────────────────────────────────────────────────────────
      # En el carril automático NADIE sube el versionCode a mano: se toma el más
      # alto que Play ya conoce y se le suma 1. Así no puede chocar nunca, que es
      # el error que sólo aparece al final de un build de 40 minutos.
      #
      # 🔴 El número se inyecta sobre la COPIA del runner con sed. El archivo del
      # repo NO se toca: lo edita otra sesión y sobrescribirlo borraría su trabajo.
      - name: Resolver versión
        id: v
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          NAME=$(grep -m1 'versionName *=' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')

          CODE=$(python3 scripts/play_check_version.py --next)
          case "$CODE" in ''|*[!0-9]*) echo "::error::No pude calcular el versionCode."; exit 1;; esac
          sed -i "s/^\( *versionCode *= *\)[0-9]\+/\1$CODE/" app/build.gradle.kts

          # Comprobar que el sed SÍ pegó: si el formato de esa línea cambia algún
          # día, el build seguiría tan campante con el número VIEJO y Play lo
          # rechazaría al final, tras 40 minutos. Falla aquí, en 2 segundos.
          APLICADO=$(grep -m1 'versionCode *=' app/build.gradle.kts | tr -dc '0-9')
          [ "$APLICADO" = "$CODE" ] || { echo "::error::El versionCode no se aplicó ($APLICADO ≠ $CODE)."; exit 1; }

          echo "versionName=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE" >> "$GITHUB_OUTPUT"
          echo "Se publicará: $NAME ($CODE) → canal $TRACK"

      # ── Firma ────────────────────────────────────────────────────────────────
      # Llave de CARGA, no de firma: Play App Signing está activo en com.avoqado.pos,
      # así que si se filtrara, Google la reemplaza. La que firma lo que llega al
      # celular vive en Google.
      - name: Reconstruir el keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > avoqado-release.keystore
          [ -s avoqado-release.keystore ] || { echo "::error::Keystore vacío — revisa ANDROID_KEYSTORE_BASE64."; exit 1; }
          cat > keystore.properties <<EOF
          storeFile=avoqado-release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # 🔴 Los tests corren ANTES de firmar y ANTES de publicar. Con el carril
      # automático encendido esto es lo único entre un commit malo y el mostrador
      # de tus clientes: si un test falla, el job muere aquí y no se publica nada.
      - name: Tests unitarios (puerta del carril automático)
        run: ./gradlew checkNoEmojiInTestNames testDebugUnitTest

      - name: Comprobar que SÍ corrieron tests
        run: |
          total=$(find app/build/test-results/testDebugUnitTest -name '*.xml' 2>/dev/null \
            | xargs grep -ho 'tests="[0-9]*"' 2>/dev/null \
            | tr -dc '0-9\n' | paste -sd+ - | bc)
          echo "Tests ejecutados: ${total:-0}"
          [ "${total:-0}" -ge 1 ] || { echo "::error::Gradle salió en 0 pero no corrió un solo test. Verde falso."; exit 1; }

      - name: Compilar AAB y APK firmados
        run: ./gradlew bundleRelease assembleRelease

      - name: Verificar que el artefacto salió firmado
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB" || { echo "::error::No se generó el AAB."; exit 1; }
          unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|EC)' \
            || { echo "::error::El AAB NO está firmado."; exit 1; }
          echo "AAB firmado: $(du -h "$AAB" | cut -f1)"

      # ── Publicar ─────────────────────────────────────────────────────────────
      - name: Publicar en Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Las notas salen del propio commit: el cliente ve algo que describe el
          # cambio, no un "Mejoras y correcciones" perpetuo.
          NOTAS="${{ github.event.inputs.notas }}"
          [ -z "$NOTAS" ] && NOTAS=$(git log -1 --pretty=%s)
          printf '%s\n' "$NOTAS" > /tmp/notas.txt

          ESTADO=completed
          [ "$TRACK" = "production" ] && ESTADO=draft

          python3 scripts/play_release.py \
            app/build/outputs/bundle/release/app-release.aab \
            "${{ steps.v.outputs.versionCode }}" \
            --track "$TRACK" --status "$ESTADO" --notes /tmp/notas.txt

      - name: Guardar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: avoqado-${{ steps.v.outputs.versionName }}-${{ steps.v.outputs.versionCode }}
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Borrar la llave del runner
        if: always()
        run: rm -f avoqado-release.keystore keystore.properties

      - name: Resumen
        if: success()
        run: |
          {
            echo "### ✅ ${{ steps.v.outputs.versionName }} (${{ steps.v.outputs.versionCode }}) → **$TRACK**"
            echo ""
            if [ "$TRACK" = "production" ]; then
              echo "🔴 Quedó en **BORRADOR**. Nadie lo recibe todavía."
              echo "Play Console → Test and release → Production → *Review release*."
            else
              echo "Tus probadores internos lo reciben en minutos, sin revisión de Google."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
