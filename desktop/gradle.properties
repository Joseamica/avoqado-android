org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Sin esto el daemon de Kotlin arranca con 2 GB y muere compilando 530 archivos (medido en Android, 31-ago).
kotlin.daemon.jvmargs=-Xmx4g
# avq-verify borra build/ del snapshot en cada corrida: la caché de build es lo único que evita recompilar :plataforma.
org.gradle.caching=true
org.gradle.workers.max=4
